name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # npm trusted publishing (OIDC) and provenance attestations.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Staged publishing (`npm stage publish`) needs npm 11.15+.
      - run: npm install -g npm@^11.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen --check
      - run: pnpm check
      # Opens a "Version packages" pull request from the changesets; when that pull request is
      # merged, stages the new version on npm with provenance. The trusted publisher only allows
      # staging: a maintainer approves the staged version with 2FA on npmjs.com.
      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: node scripts/stage-publish.mjs
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
