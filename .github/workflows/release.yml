name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # npm trusted publishing (OIDC) and provenance attestations.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5+.
      - run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen --check
      - run: pnpm check
      # Opens a "Version packages" pull request from the changesets; when that pull request is
      # merged, publishes to npm with provenance.
      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
